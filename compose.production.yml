name: storage

x-logging: &logging
  driver: syslog
  options:
    syslog-address: '${LOG_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}'
    syslog-format: rfc5424micro
    tag: '{{.Name}}'
    mode: non-blocking
    max-buffer-size: '4m'
    cache-max-size: '10m'
    cache-max-file: '3'

x-app: &app
  image: ${STORAGE_IMAGE:-storage-app:local}
  build:
    context: .
    target: app
  user: '10001:10001'
  env_file: .env
  environment:
    STORAGE_ANDROID_KEYSTORE_PASSWORD: ''
  volumes:
    - type: bind
      source: ${APP_DATA_DIR:?Set APP_DATA_DIR}
      target: /app/var
      bind:
        create_host_path: false
    - type: bind
      source: ${MINIO_DATA_DIR:?Set MINIO_DATA_DIR}
      target: /storage-disk
      read_only: true
      bind:
        create_host_path: false
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 1g
  memswap_limit: 1g
  cpus: 2
  stop_grace_period: 180s
  logging: *logging

services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    user: '10001:10001'
    command: ['--json', 'server', '/data', '--console-address', ':9001']
    env_file: .env
    environment:
      STORAGE_ANDROID_KEYSTORE_PASSWORD: ''
    networks: [storage]
    volumes:
      - type: bind
        source: ${MINIO_DATA_DIR:?Set MINIO_DATA_DIR}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    logging: *logging

  migrate:
    <<: *app
    entrypoint: ['alembic']
    command: ['upgrade', 'head']
    restart: 'no'
    network_mode: none
    volumes:
      - type: bind
        source: ${APP_DATA_DIR:?Set APP_DATA_DIR}
        target: /app/var
        bind:
          create_host_path: false

  api:
    <<: *app
    networks:
      storage:
      ingress:
        aliases: [api-ingress]
    ports:
      - '127.0.0.1:7000:7000'
    command: ['api', '--host', 'api-ingress', '--port', '7000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://api-ingress:7000/health/live', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  bot:
    <<: *app
    command: ['bot']
    networks: [storage, outbound]
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    image: ${STORAGE_WORKER_IMAGE:-storage-worker:local}
    build:
      context: .
      target: worker
    command: ['worker']
    networks: [storage, outbound]
    pids_limit: 256
    mem_limit: ${WORKER_MEMORY_LIMIT:-4g}
    memswap_limit: ${WORKER_MEMORY_LIMIT:-4g}
    volumes:
      - type: bind
        source: ${APP_DATA_DIR:?Set APP_DATA_DIR}
        target: /app/var
        bind:
          create_host_path: false
      - type: bind
        source: ${MINIO_DATA_DIR:?Set MINIO_DATA_DIR}
        target: /storage-disk
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEL_CACHE_DIR:?Set MODEL_CACHE_DIR}
        target: /app/cache
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

networks:
  storage:
    internal: true
  outbound:
  ingress:
