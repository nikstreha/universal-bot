name: storage-dev

x-logging: &logging
  driver: syslog
  options:
    syslog-address: '${LOG_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}'
    syslog-format: rfc5424micro
    tag: '{{.Name}}'
    mode: non-blocking
    max-buffer-size: '4m'
    cache-max-size: '10m'
    cache-max-file: '3'

x-app: &app
  build:
    context: .
    target: cpu
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  env_file: .env
  volumes:
    - ${DEV_DATA_DIR:-./var}:/app/var
    - minio_dev_data:/storage-disk:ro
  init: true
  logging: *logging

services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: ['--json', 'server', '/data', '--console-address', ':9001']
    env_file: .env
    logging: *logging
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_dev_data:/data

  migrate:
    <<: *app
    entrypoint: ['alembic']
    command: ['upgrade', 'head']

  api:
    <<: *app
    command: ['api', '--host', 'api']
    ports:
      - '127.0.0.1:7000:7000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  bot:
    <<: *app
    command: ['bot']
    profiles: ['telegram']
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['worker']
    volumes:
      - ${DEV_DATA_DIR:-./var}:/app/var
      - minio_dev_data:/storage-disk:ro
      - ${MODEL_CACHE_DIR:-./var/cache}:/app/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

volumes:
  minio_dev_data:
