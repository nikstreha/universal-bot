name: storage-dev

x-logging: &logging
  driver: syslog
  options:
    syslog-address: '${LOG_SYSLOG_ADDRESS:-tcp://127.0.0.1:1514}'
    syslog-format: rfc5424micro
    tag: '{{.Name}}'
    mode: non-blocking
    max-buffer-size: '4m'
    cache-max-size: '10m'
    cache-max-file: '3'

x-app: &app
  build:
    context: .
    target: cpu
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  env_file: .env
  environment:
    STORAGE_ANDROID_KEYSTORE_PASSWORD: ''
  volumes:
    - ${DEV_DATA_DIR:-./var}:/app/var
    - ${GARAGE_SPACE_DIR:?Set GARAGE_SPACE_DIR}:/storage-disk:ro
  init: true
  logging: *logging

services:
  garage:
    image: ${GARAGE_IMAGE:-docker.io/dxflrs/garage@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5}
    entrypoint: ['/garage']
    command: ['server', '--single-node']
    user: '10001:10001'
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    volumes:
      - type: bind
        source: ${GARAGE_CONFIG_FILE:?Set GARAGE_CONFIG_FILE}
        target: /etc/garage.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GARAGE_DATA_DIR:?Set GARAGE_DATA_DIR}
        target: /var/lib/garage
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    healthcheck:
      test: ['CMD', '/garage', 'json-api', 'GetClusterHealth']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    logging: *logging
    ports: ['127.0.0.1:3900:3900']

  migrate:
    <<: *app
    entrypoint: ['alembic']
    command: ['upgrade', 'head']

  api:
    <<: *app
    command: ['api', '--host', 'api']
    ports:
      - '127.0.0.1:7000:7000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_started

  bot:
    <<: *app
    command: ['bot']
    profiles: ['telegram']
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['worker']
    volumes:
      - ${DEV_DATA_DIR:-./var}:/app/var
      - ${GARAGE_SPACE_DIR:?Set GARAGE_SPACE_DIR}:/storage-disk:ro
      - ${MODEL_CACHE_DIR:-./var/cache}:/app/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_started
