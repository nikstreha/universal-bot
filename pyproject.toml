[project]
name = "universal-bot"
version = "0.2.0"
description = "Private storage and Telegram audio transcription"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162.4",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.16.2",
  "minio>=7.2.20",
  "pillow>=13.0.0",
  "filetype>=1.2.0",
  "sqlalchemy[asyncio]>=2.1.8",
  "alembic>=1.20.1",
  "dishka>=1.10.1",
  "aiosqlite>=0.22.1",
  "pydantic>=2.14.3",
  "python-dotenv>=1.2.4",
  "urllib3>=2.8.0",
  "typer>=0.29.1",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
