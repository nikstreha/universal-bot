repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (uv.lock)
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: uv-lock
        name: Check uv.lock
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
